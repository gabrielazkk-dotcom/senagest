name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key-for-build
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: public-vapid-key-for-build
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar segurança
        run: npm audit --audit-level=high

      - name: Verificar qualidade
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Gerar build de produção
        run: npm run build
